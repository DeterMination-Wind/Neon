name: 🐛 Bug 报告 / Bug Report
description: 报告 Neon 的功能异常、崩溃或显示问题 / Report a malfunction, crash, or visual bug in Neon
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        ## 📧 建议优先发邮件到 bugsoc@qq.com

        本仓库的 Issue 由作者在空闲时间处理，**响应时间可能长达数周**，也可能长时间没有回复。如果希望问题尽快被看到，请直接发送邮件到 **bugsoc@qq.com**，并在邮件里附上：Neon 版本、Mindustry 版本与平台、复现步骤、报错日志和截图。也可以加入 [BEK 辅助 mod 反馈群](https://qm.qq.com/q/cZWzPa4cTu) 提问。

        仍然要在这里提交 Issue 的话，请把下面内容填完整，信息越全越容易定位问题。

        ---

        ## 📧 Please email bugsoc@qq.com first

        Issues here are handled by the author in spare time and **responses may take weeks**, sometimes with no reply at all. If you want it seen sooner, email **bugsoc@qq.com** and include: Neon version, Mindustry version and platform, reproduction steps, error logs and screenshots. You can also ask in the [BEK mod feedback QQ group](https://qm.qq.com/q/cZWzPa4cTu).

        If you still open an issue here, please fill in everything below — the more complete the report, the easier it is to track down.

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认 / Before submitting
      description: 请先确认已完成以下排查，可避免大量重复问题。/ Please confirm the following first.
      options:
        - label: 我已更新到 [Releases](https://github.com/DeterMination-Wind/Neon/releases) 最新版本后仍能复现。/ I can still reproduce this on the latest release.
          required: true
        - label: 我已搜索过现有 Issue，没有发现相同问题。/ I searched existing issues and found no duplicate.
          required: true
        - label: 我**没有**同时启用 Neon 和对应的独立版子模组（例如单独安装的 betterMiniMap）。/ I am **not** running Neon alongside the standalone version of the same sub-mod.
          required: true
        - label: 我知道 GitHub Issue 的响应时间可能长达数周，紧急问题会改发邮件到 bugsoc@qq.com。/ I understand GitHub issues may take weeks to answer, and urgent problems should be emailed to bugsoc@qq.com.
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: 运行平台 / Platform
      options:
        - Windows（桌面版 / desktop）
        - Linux（桌面版 / desktop）
        - macOS（桌面版 / desktop）
        - Android（手机或平板 / phone or tablet）
        - 其他 / Other（请在描述中说明 / explain below）
    validations:
      required: true

  - type: input
    id: neon_version
    attributes:
      label: Neon 版本 / Neon version
      description: 在 `设置 → 模组` 中查看，或填写 Release 名称、提交哈希。/ See `Settings → Mods`, or give the release name / commit hash.
      placeholder: 例如 / e.g. 1.9.0 或 190000
    validations:
      required: true

  - type: input
    id: game_version
    attributes:
      label: Mindustry 版本 / Mindustry version
      placeholder: 例如 / e.g. v160.1 / BE build number
    validations:
      required: true

  - type: input
    id: mindustryx
    attributes:
      label: MindustryX 或其他兼容环境 / MindustryX or compatible environment
      description: 是否安装了 MindustryX 或提供 OverlayUI 兼容接口的模组？填写名称与版本，没有可写「无」。/ Installed MindustryX or another OverlayUI-compatible mod? Give name and version, or write "none".
      placeholder: 例如 / e.g. MindustryX 2026.xx / none
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 尽量写成可重复的步骤，从进入游戏或打开某个界面开始。/ List repeatable steps, starting from launching the game or opening a UI.
      placeholder: |
        1. 进入单人游戏，加载地图 ... / Start a single-player game, load map ...
        2. 打开 设置 → 模组 → Neon，开启 ... / Open Settings → Mods → Neon, enable ...
        3. 按下快捷键 ... / Press the hotkey ...
        4. 出现问题 / Bug appears
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected behavior
      description: 你认为正常情况下应该发生什么？/ What should happen normally?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual behavior
      description: 实际发生了什么？是否崩溃、卡顿、界面错位或功能无响应？/ What happened instead? Crash, freeze, misplaced UI, unresponsive feature?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图 / 录屏 - Logs, screenshots, recordings
      description: 请粘贴 `logs/` 下的报错堆栈（尤其是 `Exception` / `Caused by` 部分），或附上截图、录屏链接。可以直接把图片拖进这个输入框上传。/ Paste the stack trace from `logs/` (especially `Exception` / `Caused by` lines), or link screenshots / recordings. You can drag images straight into this field.
      placeholder: 粘贴日志文本，或说明截图、录屏的位置 / Paste log text or describe where the files are
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
      description: 涉及哪些 Neon 功能？是否只在特定地图、服务器或联机模式下出现？做过哪些尝试？/ Which Neon features are involved? Only on certain maps/servers/multiplayer? What did you already try?
      placeholder: 例如 只在联机服务器出现 / 关闭某功能后恢复 / 已重装 Neon；e.g. only in multiplayer, disabling a feature fixes it, reinstalled Neon
    validations:
      required: false
