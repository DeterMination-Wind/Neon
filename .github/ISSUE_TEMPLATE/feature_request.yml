name: 💡 功能建议 / Feature Request
description: 提出新功能、体验改进或现有功能的调整建议。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        ## 📧 建议优先发邮件到 **bugsoc@qq.com**

        本仓库的 Issue 由作者在空闲时间处理，**响应时间可能长达数周**。
        如果你希望建议尽快被看到，请直接发送邮件到 **bugsoc@qq.com**，说明使用场景和你期望的效果。
        也可以加入 [BEK 辅助 mod 反馈群](https://qm.qq.com/q/cZWzPa4cTu) 讨论。

  - type: checkboxes
    id: precheck
    attributes:
      label: 提交前确认
      options:
        - label: 我已查看 [FEATURES.md](https://github.com/DeterMination-Wind/Neon/blob/main/FEATURES.md) 和 Neon 设置页，确认现有功能无法满足需求。
          required: true
        - label: 我已搜索过现有 Issue，没有发现相同的建议。
          required: true
        - label: 我知道 GitHub Issue 的响应时间可能长达数周。
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 新功能
        - 现有功能改进
        - 界面 / 交互 / 文案
        - 兼容性（MindustryX、安卓、联机等）
        - 性能优化
        - 其他
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要它？现在是怎么绕过这个问题的？
      placeholder: 例如 在联机建造时，我需要快速确认 ...，现在只能手动 ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果
      description: 描述你希望 Neon 怎么做。如果有参考模组、截图或界面草图，可以贴在下面。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 是否已经有其他模组或做法能部分解决问题？为什么不够用？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 这个功能是否只对特定玩法重要？是否愿意参与测试或提供更多细节？
    validations:
      required: false
