logicsugar.hint.case=与 switch 表达式比较的值，首个匹配的 case 执行其分支体。
logicsugar.hint.chain.base=第一个节点值槽的起始物理地址；非负整数字面量。
logicsugar.hint.chain.memory=承载链表节点的内存块变量，如 cell1。节点 i 的值槽在 基址+2*i、next 槽在 基址+2*i+1；声明的区间不可与同一内存块上的其它结构重叠。
logicsugar.hint.chain.name=链表名：运算卡与表达式都用它引用这个链表（初始化、重置、分配节点、释放节点、读取节点值、写入节点值、下一个节点、连接节点、设置头、读取头、长度）。必须全程序唯一。
logicsugar.hint.chain.size=节点个数；至少为 1 的整数。需要 2*size 个内存单元；空闲链为空时「分配节点」返回 -1。
logicsugar.hint.datacall.arguments=按函数顺序填写实参，多个实参用逗号分隔。
logicsugar.hint.datacall.array_avg=array_avg(buf)：buf 是已声明的数组或矩阵；把算术平均值写入结果变量（默认为 result）。
logicsugar.hint.datacall.array_copy=array_copy(dst, src)：dst 是已声明的目标数组，src 是已声明的源数组；复制全部元素。此积木没有返回值。
logicsugar.hint.datacall.array_count=array_count(buf, value)：buf 是已声明的数组或矩阵，value 是要比较的值；把匹配数量写入结果变量（默认为 result）。
logicsugar.hint.datacall.array_fill=array_fill(buf, value)：buf 是已声明的数组或矩阵，value 会写入每个元素。此积木没有返回值。
logicsugar.hint.datacall.array_find=array_find(buf, value)：buf 是已声明的数组或矩阵，value 是目标值；把第一个匹配下标写入 result，找不到时为 -1。
logicsugar.hint.datacall.array_lower_bound=array_lower_bound(buf, value)：buf 是已按升序排列的数组或矩阵，value 是目标值；把目标下标写入 result，找不到时为 -1。
logicsugar.hint.datacall.array_max=array_max(buf)：buf 是已声明的数组或矩阵；把最大元素写入结果变量（默认为 result）。
logicsugar.hint.datacall.array_min=array_min(buf)：buf 是已声明的数组或矩阵；把最小元素写入结果变量（默认为 result）。
logicsugar.hint.datacall.array_replace=array_replace(buf, oldValue, newValue)：buf 是已声明的数组或矩阵，oldValue 是要查找的值，newValue 是替换值；把替换次数写入 result。
logicsugar.hint.datacall.array_reverse=array_reverse(buf)：buf 是已声明的数组或矩阵；原地反转元素。此积木没有返回值。
logicsugar.hint.datacall.array_sort=array_sort(buf)：buf 是已声明的数组或矩阵；原地升序排序。此积木没有返回值。
logicsugar.hint.datacall.array_sort_desc=array_sort_desc(buf)：buf 是已声明的数组或矩阵；原地降序排序。此积木没有返回值。
logicsugar.hint.datacall.array_sum=array_sum(buf)：buf 是已声明的数组或矩阵；把所有元素之和写入积木左侧结果变量（默认为 result）。
logicsugar.hint.datacall.array_swap=array_swap(buf, i, j)：buf 是已声明的数组或矩阵，i 和 j 是元素下标；交换两个元素。此积木没有返回值。
logicsugar.hint.datacall.avg=avg(buf)：buf 是已声明的数组或矩阵；把算术平均值写入结果变量（默认为 result）。
logicsugar.hint.datacall.bclr=bclr(bits, index)：bits 是已声明的位集，index 是位下标；清除该位并把 1 写入 result（越界不修改但仍返回 1）。
logicsugar.hint.datacall.bcount=bcount(bits)：bits 是已声明的位集；把所有置位的位数量写入 result。
logicsugar.hint.datacall.bitset_count=bitset_count(bits)：bits 是已声明的位集；把所有置位的位数量写入 result。
logicsugar.hint.datacall.bitset_reset=bitset_reset(bits, index)：bits 是已声明的位集，index 是位下标；清除该位并把 1 写入 result（越界不修改但仍返回 1）。
logicsugar.hint.datacall.bitset_set=bitset_set(bits, index)：bits 是已声明的位集，index 是位下标；设置该位并把 1 写入 result（越界不修改但仍返回 1）。
logicsugar.hint.datacall.bitset_test=bitset_test(bits, index)：bits 是已声明的位集，index 是位下标；把该位是否为 1（1/0）写入 result。
logicsugar.hint.datacall.bsearch=bsearch(buf, value)：buf 是已按升序排列的数组或矩阵，value 是目标值；把目标下标写入 result，找不到时为 -1。
logicsugar.hint.datacall.bset=bset(bits, index)：bits 是已声明的位集，index 是位下标；设置该位并把 1 写入 result（越界不修改但仍返回 1）。
logicsugar.hint.datacall.btest=btest(bits, index)：bits 是已声明的位集，index 是位下标；把该位是否为 1（1/0）写入 result。
logicsugar.hint.datacall.cclear=cclear(chain)：chain 是已声明的链表；重置链表和空闲节点链，并把容量写入 result。
logicsugar.hint.datacall.cfree=cfree(chain, index)：chain 是已声明的链表，index 是节点下标；释放节点并挂回空闲链，成功向 result 写入 1，非法下标写入 -1。
logicsugar.hint.datacall.cget=cget(chain, index)：chain 是已声明的链表，index 是节点下标；把节点值写入 result，越界时为 NaN。
logicsugar.hint.datacall.chain_alloc=chain_alloc(chain)：chain 是已声明的链表；分配一个空闲节点，将 next 设为 -1，并把节点下标写入 result；没有空闲节点时为 -1。
logicsugar.hint.datacall.chain_clear=chain_clear(chain)：chain 是已声明的链表；重置链表和空闲节点链，并把容量写入 result。
logicsugar.hint.datacall.chain_free=chain_free(chain, index)：chain 是已声明的链表，index 是节点下标；释放节点并挂回空闲链，成功向 result 写入 1，非法下标写入 -1。
logicsugar.hint.datacall.chain_get=chain_get(chain, index)：chain 是已声明的链表，index 是节点下标；把节点值写入 result，越界时为 NaN。
logicsugar.hint.datacall.chain_head=chain_head(chain)：chain 是已声明的链表；把当前头节点下标写入 result。
logicsugar.hint.datacall.chain_init=chain_init(chain)：chain 是已声明的链表；重建空闲节点链，并把容量写入 result。
logicsugar.hint.datacall.chain_len=chain_len(chain)：chain 是已声明的链表；从头节点遍历，并把可到达节点数量写入 result。
logicsugar.hint.datacall.chain_link=chain_link(chain, index, next)：chain 是已声明的链表，index 是要修改 next 的节点下标，next 是目标下标（-1 表示链尾）；成功向 result 写入 1，index 无效写入 -1。
logicsugar.hint.datacall.chain_next=chain_next(chain, index)：chain 是已声明的链表，index 是节点下标；把节点的 next 下标写入 result，越界时为 -1。
logicsugar.hint.datacall.chain_set=chain_set(chain, index, value)：chain 是已声明的链表，index 是节点下标，value 是要写入的值；成功向 result 写入 1；越界不写入，result 为 -1。
logicsugar.hint.datacall.chain_set_head=chain_set_head(chain, index)：chain 是已声明的链表，index 是新的头节点值；直接设置头节点且不校验，并把 1 写入 result。
logicsugar.hint.datacall.chead=chead(chain)：chain 是已声明的链表；把当前头节点下标写入 result。
logicsugar.hint.datacall.cinit=cinit(chain)：chain 是已声明的链表；重建空闲节点链，并把容量写入 result。
logicsugar.hint.datacall.clen=clen(chain)：chain 是已声明的链表；从头节点遍历，并把可到达节点数量写入 result。
logicsugar.hint.datacall.clink=clink(chain, index, next)：chain 是已声明的链表，index 是要修改 next 的节点下标，next 是目标下标（-1 表示链尾）；成功向 result 写入 1，index 无效写入 -1。
logicsugar.hint.datacall.cnew=cnew(chain)：chain 是已声明的链表；分配一个空闲节点，将 next 设为 -1，并把节点下标写入 result；没有空闲节点时为 -1。
logicsugar.hint.datacall.cnext=cnext(chain, index)：chain 是已声明的链表，index 是节点下标；把节点的 next 下标写入 result，越界时为 -1。
logicsugar.hint.datacall.copy=copy(dst, src)：dst 是已声明的目标数组，src 是已声明的源数组；复制全部元素。此积木没有返回值。
logicsugar.hint.datacall.count=count(buf, value)：buf 是已声明的数组或矩阵，value 是要比较的值；把匹配数量写入结果变量（默认为 result）。
logicsugar.hint.datacall.cset=cset(chain, index, value)：chain 是已声明的链表，index 是节点下标，value 是要写入的值；成功向 result 写入 1；越界不写入，result 为 -1。
logicsugar.hint.datacall.cshead=cshead(chain, index)：chain 是已声明的链表，index 是新的头节点值；直接设置头节点且不校验，并把 1 写入 result。
logicsugar.hint.datacall.dclear=dclear(d)：d 是已声明的双端队列；清空内容及 head/tail/count 状态。此积木没有返回值。
logicsugar.hint.datacall.deque_back=deque_back(d)：d 是已声明的双端队列；读取队尾但不移除，并把值写入 result（空时返回 NaN）。
logicsugar.hint.datacall.deque_clear=deque_clear(d)：d 是已声明的双端队列；清空内容及 head/tail/count 状态。此积木没有返回值。
logicsugar.hint.datacall.deque_front=deque_front(d)：d 是已声明的双端队列；读取队首但不移除，并把值写入 result（空时返回 NaN）。
logicsugar.hint.datacall.deque_pop_back=deque_pop_back(d)：d 是已声明的双端队列；移除队尾并把值写入 result（空时返回 NaN）。
logicsugar.hint.datacall.deque_pop_front=deque_pop_front(d)：d 是已声明的双端队列；移除队首并把值写入 result（空时返回 NaN）。
logicsugar.hint.datacall.deque_push_back=deque_push_back(d, value)：d 是已声明的双端队列，value 插入队尾；成功时把操作后的长度写入 result；已满时不写入，result 为 -1。
logicsugar.hint.datacall.deque_push_front=deque_push_front(d, value)：d 是已声明的双端队列，value 插入队首；成功时把操作后的长度写入 result；已满时不写入，result 为 -1。
logicsugar.hint.datacall.deque_size=deque_size(d)：d 是已声明的双端队列；把当前元素数量写入 result。
logicsugar.hint.datacall.dpeekb=dpeekb(d)：d 是已声明的双端队列；读取队尾但不移除，并把值写入 result（空时返回 NaN）。
logicsugar.hint.datacall.dpeekf=dpeekf(d)：d 是已声明的双端队列；读取队首但不移除，并把值写入 result（空时返回 NaN）。
logicsugar.hint.datacall.dpopb=dpopb(d)：d 是已声明的双端队列；移除队尾并把值写入 result（空时返回 NaN）。
logicsugar.hint.datacall.dpopf=dpopf(d)：d 是已声明的双端队列；移除队首并把值写入 result（空时返回 NaN）。
logicsugar.hint.datacall.dpushb=dpushb(d, value)：d 是已声明的双端队列，value 插入队尾；成功时把操作后的长度写入 result；已满时不写入，result 为 -1。
logicsugar.hint.datacall.dpushf=dpushf(d, value)：d 是已声明的双端队列，value 插入队首；成功时把操作后的长度写入 result；已满时不写入，result 为 -1。
logicsugar.hint.datacall.dsize=dsize(d)：d 是已声明的双端队列；把当前元素数量写入 result。
logicsugar.hint.datacall.fill=fill(buf, value)：buf 是已声明的数组或矩阵，value 会写入每个元素。此积木没有返回值。
logicsugar.hint.datacall.heap_pop=heap_pop(heap)：heap 是已声明的小顶堆；移除最小值并把它写入 result，空堆时为 NaN。
logicsugar.hint.datacall.heap_push=heap_push(heap, value)：heap 是已声明的小顶堆，value 插入堆中；成功向 result 写入 1；已满不写入，result 为 -1。
logicsugar.hint.datacall.heap_size=heap_size(heap)：heap 是已声明的小顶堆；把当前元素数量写入 result。
logicsugar.hint.datacall.hpop=hpop(heap)：heap 是已声明的小顶堆；移除最小值并把它写入 result，空堆时为 NaN。
logicsugar.hint.datacall.hpush=hpush(heap, value)：heap 是已声明的小顶堆，value 插入堆中；成功向 result 写入 1；已满不写入，result 为 -1。
logicsugar.hint.datacall.hsize=hsize(heap)：heap 是已声明的小顶堆；把当前元素数量写入 result。
logicsugar.hint.datacall.indexof=indexof(buf, value)：buf 是已声明的数组或矩阵，value 是目标值；把第一个匹配下标写入 result，找不到时为 -1。
logicsugar.hint.datacall.lappend=lappend(list, value)：list 是已声明的列表，value 追加到末尾；成功时把追加后的列表长度写入 result；列表满时不写入，result 为 -1。
logicsugar.hint.datacall.lfind=lfind(list, value)：list 是已声明的列表，value 是目标值；把第一个匹配下标写入 result，找不到时为 -1。
logicsugar.hint.datacall.lget=lget(list, index)：list 是已声明的列表，index 是元素下标；把该元素写入 result，越界时为 NaN。
logicsugar.hint.datacall.linsert=linsert(list, index, value)：list 是已声明的列表，index 是插入位置，value 插入该位置；成功向 result 写入 1；无效或已满不写入，result 为 -1。
logicsugar.hint.datacall.lremove=lremove(list, index)：list 是已声明的列表，index 是元素下标；删除该元素并把被删值写入 result，无效时为 NaN。
logicsugar.hint.datacall.lset=lset(list, index, value)：list 是已声明的列表，index 是元素下标，value 是要写入的值；成功向 result 写入 1；越界不写入，result 为 -1。
logicsugar.hint.datacall.lsize=lsize(list)：list 是已声明的列表；把当前元素数量写入 result。
logicsugar.hint.datacall.map_clear=map_clear(map)：map 是已声明的哈希表；清空所有键槽，使其可以开始使用。此积木没有返回值。
logicsugar.hint.datacall.map_contains=map_contains(map, key)：map 是已声明的哈希表，key 是数字键；存在时向 result 写入 1，否则写入 0。
logicsugar.hint.datacall.map_erase=map_erase(map, key)：map 是已声明的哈希表，key 是数字键；删除键：成功向 result 写入 1，键不存在写入 -1。
logicsugar.hint.datacall.map_get=map_get(map, key)：map 是已声明的哈希表，key 是数字键；把存储的值写入 result，不存在时为 NaN。
logicsugar.hint.datacall.map_set=map_set(map, key, value)：map 是已声明的哈希表，key 是数字键，value 是要存储的值；成功向 result 写入 1，满表或无效键写入 -1。
logicsugar.hint.datacall.map_size=map_size(map)：map 是已声明的哈希表；把当前存储的键数量写入 result。
logicsugar.hint.datacall.mapclear=mapclear(map)：map 是已声明的哈希表；清空所有键槽，使其可以开始使用。此积木没有返回值。
logicsugar.hint.datacall.mapdel=mapdel(map, key)：map 是已声明的哈希表，key 是数字键；删除键：成功向 result 写入 1，键不存在写入 -1。
logicsugar.hint.datacall.mapget=mapget(map, key)：map 是已声明的哈希表，key 是数字键；把存储的值写入 result，不存在时为 NaN。
logicsugar.hint.datacall.maphas=maphas(map, key)：map 是已声明的哈希表，key 是数字键；存在时向 result 写入 1，否则写入 0。
logicsugar.hint.datacall.mapset=mapset(map, key, value)：map 是已声明的哈希表，key 是数字键，value 是要存储的值；成功向 result 写入 1，满表或无效键写入 -1。
logicsugar.hint.datacall.mapsize=mapsize(map)：map 是已声明的哈希表；把当前存储的键数量写入 result。
logicsugar.hint.datacall.max=max(buf)：buf 是已声明的数组或矩阵；把最大元素写入结果变量（默认为 result）。
logicsugar.hint.datacall.min=min(buf)：buf 是已声明的数组或矩阵；把最小元素写入结果变量（默认为 result）。
logicsugar.hint.datacall.operation=卡内运算按钮：点开可选择本结构的运算；切换运算会把实参重设成该运算的默认形状。
logicsugar.hint.datacall.qclear=qclear(q)：q 是已声明的队列；清空内容及 head/tail/count 状态。此积木没有返回值。
logicsugar.hint.datacall.qpeek=qpeek(q)：q 是已声明的队列；读取队首但不移除，并把值写入 result（空队列返回 NaN）。
logicsugar.hint.datacall.qpop=qpop(q)：q 是已声明的队列；移除队首，并把队首值写入 result（空队列返回 NaN）。
logicsugar.hint.datacall.qpush=qpush(q, value)：q 是已声明的队列，value 会追加到队尾；成功时把入队后的长度写入 result；队列满时不写入，result 为 -1。
logicsugar.hint.datacall.qsize=qsize(q)：q 是已声明的队列；把当前元素数量写入 result。
logicsugar.hint.datacall.queue_clear=queue_clear(q)：q 是已声明的队列；清空内容及 head/tail/count 状态。此积木没有返回值。
logicsugar.hint.datacall.queue_front=queue_front(q)：q 是已声明的队列；读取队首但不移除，并把值写入 result（空队列返回 NaN）。
logicsugar.hint.datacall.queue_pop=queue_pop(q)：q 是已声明的队列；移除队首，并把队首值写入 result（空队列返回 NaN）。
logicsugar.hint.datacall.queue_push=queue_push(q, value)：q 是已声明的队列，value 会追加到队尾；成功时把入队后的长度写入 result；队列满时不写入，result 为 -1。
logicsugar.hint.datacall.queue_size=queue_size(q)：q 是已声明的队列；把当前元素数量写入 result。
logicsugar.hint.datacall.replace=replace(buf, oldValue, newValue)：buf 是已声明的数组或矩阵，oldValue 是要查找的值，newValue 是替换值；把替换次数写入 result。
logicsugar.hint.datacall.reverse=reverse(buf)：buf 是已声明的数组或矩阵；原地反转元素。此积木没有返回值。
logicsugar.hint.datacall.sclear=sclear(s)：s 是已声明的栈；清空内容和隐藏栈顶计数。此积木没有返回值。
logicsugar.hint.datacall.set_add=set_add(set, key)：set 是已声明的集合，key 是数字成员；插入成员，并把成功 1 或满表/无效键 -1 写入 result。
logicsugar.hint.datacall.set_clear=set_clear(set)：set 是已声明的集合；清空所有成员槽，使其可以开始使用。此积木没有返回值。
logicsugar.hint.datacall.set_contains=set_contains(set, key)：set 是已声明的集合，key 是数字成员；存在时向 result 写入 1，否则写入 0。
logicsugar.hint.datacall.set_remove=set_remove(set, key)：set 是已声明的集合，key 是数字成员；删除成员：成功向 result 写入 1，成员不存在写入 -1。
logicsugar.hint.datacall.set_size=set_size(set)：set 是已声明的集合；把当前成员数量写入 result。
logicsugar.hint.datacall.sortasc=sortasc(buf)：buf 是已声明的数组或矩阵；原地升序排序。此积木没有返回值。
logicsugar.hint.datacall.sortdesc=sortdesc(buf)：buf 是已声明的数组或矩阵；原地降序排序。此积木没有返回值。
logicsugar.hint.datacall.speek=speek(s)：s 是已声明的栈；读取栈顶但不移除，并把值写入 result（空栈返回 NaN）。
logicsugar.hint.datacall.spop=spop(s)：s 是已声明的栈；移除栈顶，并把栈顶值写入 result（空栈返回 NaN）。
logicsugar.hint.datacall.spush=spush(s, value)：s 是已声明的栈，value 是要压入的值；成功时把压入后的栈长度写入 result；栈满时不写入，result 为 -1。
logicsugar.hint.datacall.ssize=ssize(s)：s 是已声明的栈；把当前元素数量写入 result。
logicsugar.hint.datacall.stack_clear=stack_clear(s)：s 是已声明的栈；清空内容和隐藏栈顶计数。此积木没有返回值。
logicsugar.hint.datacall.stack_pop=stack_pop(s)：s 是已声明的栈；移除栈顶，并把栈顶值写入 result（空栈返回 NaN）。
logicsugar.hint.datacall.stack_push=stack_push(s, value)：s 是已声明的栈，value 是要压入的值；成功时把压入后的栈长度写入 result；栈满时不写入，result 为 -1。
logicsugar.hint.datacall.stack_size=stack_size(s)：s 是已声明的栈；把当前元素数量写入 result。
logicsugar.hint.datacall.stack_top=stack_top(s)：s 是已声明的栈；读取栈顶但不移除，并把值写入 result（空栈返回 NaN）。
logicsugar.hint.datacall.sum=sum(buf)：buf 是已声明的数组或矩阵；把所有元素之和写入积木左侧结果变量（默认为 result）。
logicsugar.hint.datacall.swap=swap(buf, i, j)：buf 是已声明的数组或矩阵，i 和 j 是元素下标；交换两个元素。此积木没有返回值。
logicsugar.hint.datacall.uadd=uadd(set, key)：set 是已声明的集合，key 是数字成员；插入成员，并把成功 1 或满表/无效键 -1 写入 result。
logicsugar.hint.datacall.uclear=uclear(set)：set 是已声明的集合；清空所有成员槽，使其可以开始使用。此积木没有返回值。
logicsugar.hint.datacall.udel=udel(set, key)：set 是已声明的集合，key 是数字成员；删除成员：成功向 result 写入 1，成员不存在写入 -1。
logicsugar.hint.datacall.uhas=uhas(set, key)：set 是已声明的集合，key 是数字成员；存在时向 result 写入 1，否则写入 0。
logicsugar.hint.datacall.usize=usize(set)：set 是已声明的集合；把当前成员数量写入 result。
logicsugar.hint.datacall.vector_at=vector_at(list, index)：list 是已声明的列表，index 是元素下标；把该元素写入 result，越界时为 NaN。
logicsugar.hint.datacall.vector_erase=vector_erase(list, index)：list 是已声明的列表，index 是元素下标；删除该元素并把被删值写入 result，无效时为 NaN。
logicsugar.hint.datacall.vector_find=vector_find(list, value)：list 是已声明的列表，value 是目标值；把第一个匹配下标写入 result，找不到时为 -1。
logicsugar.hint.datacall.vector_insert=vector_insert(list, index, value)：list 是已声明的列表，index 是插入位置，value 插入该位置；成功向 result 写入 1；无效或已满不写入，result 为 -1。
logicsugar.hint.datacall.vector_push_back=vector_push_back(list, value)：list 是已声明的列表，value 追加到末尾；成功时把追加后的列表长度写入 result；列表满时不写入，result 为 -1。
logicsugar.hint.datacall.vector_set=vector_set(list, index, value)：list 是已声明的列表，index 是元素下标，value 是要写入的值；成功向 result 写入 1；越界不写入，result 为 -1。
logicsugar.hint.datacall.vector_size=vector_size(list)：list 是已声明的列表；把当前元素数量写入 result。
logicsugar.hint.default=所有未命中 case 的值走这里。跳转表里它是空槽的目标；带边界保护的形态下，越界值也会落到这里。
logicsugar.hint.deque.base=环形缓冲区在内存块上的起始物理地址；非负整数字面量。
logicsugar.hint.deque.memory=存放双端队列数据的内存块变量，如 cell1。同一内存块上与其它栈/队列/双端队列声明的区间不得重叠。
logicsugar.hint.deque.name=双端队列名：运算卡与表达式都用它引用这个双端队列（前端入队、后端入队、前端出队、后端出队、查看前端、查看后端、大小、清空）。必须全程序唯一。
logicsugar.hint.deque.size=环形缓冲区容量；至少为 1 的整数。向满的双端队列压入时返回当前长度且不写入。
logicsugar.hint.elif=当前面的 if/elif 不成立时检查的备选条件。
logicsugar.hint.for.condition=循环变量的比较条件，满足时继续循环。
logicsugar.hint.for.initial=循环变量的起始值。
logicsugar.hint.for.step=每次迭代给循环变量增加的值。
logicsugar.hint.for.variable=循环变量，从初值开始按步长递增。
logicsugar.hint.func.call=调用函数：函数体如同粘贴在此处执行。
logicsugar.hint.func.def=定义函数：函数体被所有调用点共享。
logicsugar.hint.func.return=结束当前函数调用；可携带返回值回到调用点。
logicsugar.hint.func.returns=返回声明：~ = 无返回值（void），value = 必须有返回值；留空 = 按函数体推断。
logicsugar.hint.heap.base=堆在内存块上的起始物理地址；非负整数字面量。
logicsugar.hint.heap.memory=承载堆数据的内存块变量，如 cell1。声明的区间不可与同一内存块上的其它结构重叠。
logicsugar.hint.heap.name=小顶堆名：运算卡与表达式都用它引用这个堆（压入、弹出、大小）。必须全程序唯一。
logicsugar.hint.heap.size=最大元素个数；至少为 1 的整数。向满堆压入时返回当前长度且不写入。
logicsugar.hint.if.condition=if 分支的条件表达式，为真时执行分支体。
logicsugar.hint.list.base=列表在内存块上的起始物理地址；非负整数字面量。
logicsugar.hint.list.memory=承载列表数据的内存块变量，如 cell1。声明的区间不可与同一内存块上的其它结构重叠。
logicsugar.hint.list.name=列表名：运算卡与表达式都用它引用这个列表（追加、读取、写入、插入、删除、查找、大小）。必须全程序唯一。
logicsugar.hint.list.size=最大元素个数；至少为 1 的整数。向满列表追加时返回当前长度且不写入。
logicsugar.hint.map.base=键区起始物理地址；非负整数字面量。
logicsugar.hint.map.capacity=键/值槽位数；至少为 1 的整数。需要 2*容量 个内存单元；不支持字符串键。
logicsugar.hint.map.memory=承载键与值的内存块变量，如 cell1。键占用 [基址, 基址+容量)，值占用 [基址+容量, 基址+2*容量)。
logicsugar.hint.map.name=哈希表名：运算卡与表达式都用它引用这张表（写入、读取、存在性、删除、大小、清空）。首次使用前先执行一次「清空」，把所有 key 槽写为 NaN；必须全程序唯一。
logicsugar.hint.matrix.cols=列数；至少为 1 的整数。字面量列下标超出 [0, 列数) 时编译期报错。
logicsugar.hint.matrix.name=表达式中用双下标访问的矩阵名，如 m[i][j]。地址 = 基址 + i*列数 + j；必须全程序唯一。
logicsugar.hint.matrix.rows=行数；至少为 1 的整数。字面量行下标超出 [0, 行数) 时编译期报错。
logicsugar.hint.queue.base=环形缓冲区在内存块上的起始物理地址；非负整数字面量。
logicsugar.hint.queue.memory=承载队列数据的内存块变量，如 cell1。声明的区间不可与同一内存块上的其它结构重叠。
logicsugar.hint.queue.name=队列名：运算卡与表达式都用它引用这个队列（入队、出队、查看队首、大小、清空）。必须全程序唯一。
logicsugar.hint.queue.size=环形缓冲区容量；至少为 1 的整数。向满队列压入时返回当前长度且不写入。
logicsugar.hint.stack.base=栈在内存块上的起始物理地址；非负整数字面量。
logicsugar.hint.stack.memory=承载栈数据的内存块变量，如 cell1。声明的区间不可与同一内存块上的其它结构重叠。
logicsugar.hint.stack.name=栈名：运算卡与表达式都用它引用这个栈（压入、弹出、查看顶部、大小、清空）。必须全程序唯一。
logicsugar.hint.stack.size=最大元素个数；至少为 1 的整数。向满栈压入时返回当前长度且不写入。
logicsugar.hint.switch.raw=跳转表形态，点击切换。带边界（默认）：@counter += 切换值 加两条边界守卫，再按槽位发跳转行，越界值会落到 default 分支。裸表：只发派发加槽位行、不做边界检查——手写与第三方工具生成的跳转表就是这个形态，恢复时保持原样才能逐条一致；此时越界值不会被夹回，会派发到表外。选板新建的 switch 一律是带边界形态。
logicsugar.hint.switch.stride=从手写 mlog 恢复的步长 @counter switch。每个 case 是固定长度的槽，派发是先乘再写入 @counter，所以 case 的指令数就是跳转的一部分。选板不会新建这种形态。
logicsugar.hint.switch.value=与下方各 case 比较的表达式，命中首个匹配的 case 并执行其分支体。
logicsugar.hint.uset.base=键区起始物理地址；非负整数字面量。
logicsugar.hint.uset.capacity=键槽位数；至少为 1 的整数。首次使用前先执行一次「清空」。不支持字符串键。
logicsugar.hint.uset.memory=存放键的内存块变量，如 cell1。占用 [base, base+capacity)。
logicsugar.hint.uset.name=集合名：运算卡与表达式都用它引用这个集合（添加、存在性、删除、大小、清空）。首次使用前先执行一次「清空」，把所有槽写为 NaN；必须全程序唯一。
logicsugar.hint.while.condition=循环条件，为真时重复执行循环体。
logicsugar.if.begin=条件判断
logicsugar.if.condition=如果
logicsugar.list.card=列表
logicsugar.lst.array=数组：把内存块的一段地址登记为命名数组，让表达式能用 buf[i] 下标读写。
logicsugar.lst.arrayinit=数组初始化：在此处把最多 8 个字面量写入数组的连续槽位。
logicsugar.lst.assertbounds=复杂断言不成立时，停止该处理器的执行。
logicsugar.lst.assertequals=变量与期望值不一致时，停止该处理器的执行。
logicsugar.lst.assertflush=为执行 assertprints 指令记录当前打印缓冲位置。
logicsugar.lst.assertprints=打印缓冲内容与期望值不一致时，停止该处理器的执行。
logicsugar.lst.asserttype=变量的实际类型与期望类型不符时，停止该处理器的执行。
logicsugar.lst.bitset=位集：把内存块中的 64 位字组登记为位集；运算在同栏的「位集操作」卡上，提供置位、清位、测试、计数（展开为 and/or/shl/shr 运算）。
logicsugar.lst.blockend=结束：闭合最近的未闭合块。
logicsugar.lst.break=跳出：退出最近的循环或 switch。
logicsugar.lst.breakpoint=条件满足时暂停该处理器与整个游戏。
logicsugar.lst.case=case 标签：与 switch 表达式匹配的值。
logicsugar.lst.chain=链表：把一段区间登记为单链表节点（每节点两槽：值、next）；运算在同栏的「链表操作」卡上，提供初始化、重置、分配节点、释放节点、读取节点值、写入节点值、下一个节点、连接节点、设置头、读取头、长度。首次使用前先执行一次「初始化」。
logicsugar.lst.continue=继续：跳到最近循环的下一次迭代。
logicsugar.lst.datacall=可持久化的数据结构操作积木；编译时按对应 intrinsic 降级。
logicsugar.lst.datacall.array_avg=array_avg(buf)：buf 是已声明的数组或矩阵；把算术平均值写入结果变量（默认为 result）。
logicsugar.lst.datacall.array_copy=array_copy(dst, src)：dst 是已声明的目标数组，src 是已声明的源数组；复制全部元素。此积木没有返回值。
logicsugar.lst.datacall.array_count=array_count(buf, value)：buf 是已声明的数组或矩阵，value 是要比较的值；把匹配数量写入结果变量（默认为 result）。
logicsugar.lst.datacall.array_fill=array_fill(buf, value)：buf 是已声明的数组或矩阵，value 会写入每个元素。此积木没有返回值。
logicsugar.lst.datacall.array_find=array_find(buf, value)：buf 是已声明的数组或矩阵，value 是目标值；把第一个匹配下标写入 result，找不到时为 -1。
logicsugar.lst.datacall.array_lower_bound=array_lower_bound(buf, value)：buf 是已按升序排列的数组或矩阵，value 是目标值；把目标下标写入 result，找不到时为 -1。
logicsugar.lst.datacall.array_max=array_max(buf)：buf 是已声明的数组或矩阵；把最大元素写入结果变量（默认为 result）。
logicsugar.lst.datacall.array_min=array_min(buf)：buf 是已声明的数组或矩阵；把最小元素写入结果变量（默认为 result）。
logicsugar.lst.datacall.array_replace=array_replace(buf, oldValue, newValue)：buf 是已声明的数组或矩阵，oldValue 是要查找的值，newValue 是替换值；把替换次数写入 result。
logicsugar.lst.datacall.array_reverse=array_reverse(buf)：buf 是已声明的数组或矩阵；原地反转元素。此积木没有返回值。
logicsugar.lst.datacall.array_sort=array_sort(buf)：buf 是已声明的数组或矩阵；原地升序排序。此积木没有返回值。
logicsugar.lst.datacall.array_sort_desc=array_sort_desc(buf)：buf 是已声明的数组或矩阵；原地降序排序。此积木没有返回值。
logicsugar.lst.datacall.array_sum=array_sum(buf)：buf 是已声明的数组或矩阵；把所有元素之和写入积木左侧结果变量（默认为 result）。
logicsugar.lst.datacall.array_swap=array_swap(buf, i, j)：buf 是已声明的数组或矩阵，i 和 j 是元素下标；交换两个元素。此积木没有返回值。
logicsugar.lst.datacall.avg=avg(buf)：buf 是已声明的数组或矩阵；把算术平均值写入结果变量（默认为 result）。
logicsugar.lst.datacall.bclr=bclr(bits, index)：bits 是已声明的位集，index 是位下标；清除该位并把 1 写入 result（越界不修改但仍返回 1）。
logicsugar.lst.datacall.bcount=bcount(bits)：bits 是已声明的位集；把所有置位的位数量写入 result。
logicsugar.lst.datacall.bitset_count=bitset_count(bits)：bits 是已声明的位集；把所有置位的位数量写入 result。
logicsugar.lst.datacall.bitset_reset=bitset_reset(bits, index)：bits 是已声明的位集，index 是位下标；清除该位并把 1 写入 result（越界不修改但仍返回 1）。
logicsugar.lst.datacall.bitset_set=bitset_set(bits, index)：bits 是已声明的位集，index 是位下标；设置该位并把 1 写入 result（越界不修改但仍返回 1）。
logicsugar.lst.datacall.bitset_test=bitset_test(bits, index)：bits 是已声明的位集，index 是位下标；把该位是否为 1（1/0）写入 result。
logicsugar.lst.datacall.bsearch=bsearch(buf, value)：buf 是已按升序排列的数组或矩阵，value 是目标值；把目标下标写入 result，找不到时为 -1。
logicsugar.lst.datacall.bset=bset(bits, index)：bits 是已声明的位集，index 是位下标；设置该位并把 1 写入 result（越界不修改但仍返回 1）。
logicsugar.lst.datacall.btest=btest(bits, index)：bits 是已声明的位集，index 是位下标；把该位是否为 1（1/0）写入 result。
logicsugar.lst.datacall.cclear=cclear(chain)：chain 是已声明的链表；重置链表和空闲节点链，并把容量写入 result。
logicsugar.lst.datacall.cfree=cfree(chain, index)：chain 是已声明的链表，index 是节点下标；释放节点并挂回空闲链，成功向 result 写入 1，非法下标写入 -1。
logicsugar.lst.datacall.cget=cget(chain, index)：chain 是已声明的链表，index 是节点下标；把节点值写入 result，越界时为 NaN。
logicsugar.lst.datacall.chain_alloc=chain_alloc(chain)：chain 是已声明的链表；分配一个空闲节点，将 next 设为 -1，并把节点下标写入 result；没有空闲节点时为 -1。
logicsugar.lst.datacall.chain_clear=chain_clear(chain)：chain 是已声明的链表；重置链表和空闲节点链，并把容量写入 result。
logicsugar.lst.datacall.chain_free=chain_free(chain, index)：chain 是已声明的链表，index 是节点下标；释放节点并挂回空闲链，成功向 result 写入 1，非法下标写入 -1。
logicsugar.lst.datacall.chain_get=chain_get(chain, index)：chain 是已声明的链表，index 是节点下标；把节点值写入 result，越界时为 NaN。
logicsugar.lst.datacall.chain_head=chain_head(chain)：chain 是已声明的链表；把当前头节点下标写入 result。
logicsugar.lst.datacall.chain_init=chain_init(chain)：chain 是已声明的链表；重建空闲节点链，并把容量写入 result。
logicsugar.lst.datacall.chain_len=chain_len(chain)：chain 是已声明的链表；从头节点遍历，并把可到达节点数量写入 result。
logicsugar.lst.datacall.chain_link=chain_link(chain, index, next)：chain 是已声明的链表，index 是要修改 next 的节点下标，next 是目标下标（-1 表示链尾）；成功向 result 写入 1，index 无效写入 -1。
logicsugar.lst.datacall.chain_next=chain_next(chain, index)：chain 是已声明的链表，index 是节点下标；把节点的 next 下标写入 result，越界时为 -1。
logicsugar.lst.datacall.chain_set=chain_set(chain, index, value)：chain 是已声明的链表，index 是节点下标，value 是要写入的值；成功向 result 写入 1；越界不写入，result 为 -1。
logicsugar.lst.datacall.chain_set_head=chain_set_head(chain, index)：chain 是已声明的链表，index 是新的头节点值；直接设置头节点且不校验，并把 1 写入 result。
logicsugar.lst.datacall.chead=chead(chain)：chain 是已声明的链表；把当前头节点下标写入 result。
logicsugar.lst.datacall.cinit=cinit(chain)：chain 是已声明的链表；重建空闲节点链，并把容量写入 result。
logicsugar.lst.datacall.clen=clen(chain)：chain 是已声明的链表；从头节点遍历，并把可到达节点数量写入 result。
logicsugar.lst.datacall.clink=clink(chain, index, next)：chain 是已声明的链表，index 是要修改 next 的节点下标，next 是目标下标（-1 表示链尾）；成功向 result 写入 1，index 无效写入 -1。
logicsugar.lst.datacall.cnew=cnew(chain)：chain 是已声明的链表；分配一个空闲节点，将 next 设为 -1，并把节点下标写入 result；没有空闲节点时为 -1。
logicsugar.lst.datacall.cnext=cnext(chain, index)：chain 是已声明的链表，index 是节点下标；把节点的 next 下标写入 result，越界时为 -1。
logicsugar.lst.datacall.copy=copy(dst, src)：dst 是已声明的目标数组，src 是已声明的源数组；复制全部元素。此积木没有返回值。
logicsugar.lst.datacall.count=count(buf, value)：buf 是已声明的数组或矩阵，value 是要比较的值；把匹配数量写入结果变量（默认为 result）。
logicsugar.lst.datacall.cset=cset(chain, index, value)：chain 是已声明的链表，index 是节点下标，value 是要写入的值；成功向 result 写入 1；越界不写入，result 为 -1。
logicsugar.lst.datacall.cshead=cshead(chain, index)：chain 是已声明的链表，index 是新的头节点值；直接设置头节点且不校验，并把 1 写入 result。
logicsugar.lst.datacall.dclear=dclear(d)：d 是已声明的双端队列；清空内容及 head/tail/count 状态。此积木没有返回值。
logicsugar.lst.datacall.deque_back=deque_back(d)：d 是已声明的双端队列；读取队尾但不移除，并把值写入 result（空时返回 NaN）。
logicsugar.lst.datacall.deque_clear=deque_clear(d)：d 是已声明的双端队列；清空内容及 head/tail/count 状态。此积木没有返回值。
logicsugar.lst.datacall.deque_front=deque_front(d)：d 是已声明的双端队列；读取队首但不移除，并把值写入 result（空时返回 NaN）。
logicsugar.lst.datacall.deque_pop_back=deque_pop_back(d)：d 是已声明的双端队列；移除队尾并把值写入 result（空时返回 NaN）。
logicsugar.lst.datacall.deque_pop_front=deque_pop_front(d)：d 是已声明的双端队列；移除队首并把值写入 result（空时返回 NaN）。
logicsugar.lst.datacall.deque_push_back=deque_push_back(d, value)：d 是已声明的双端队列，value 插入队尾；成功时把操作后的长度写入 result；已满时不写入，result 为 -1。
logicsugar.lst.datacall.deque_push_front=deque_push_front(d, value)：d 是已声明的双端队列，value 插入队首；成功时把操作后的长度写入 result；已满时不写入，result 为 -1。
logicsugar.lst.datacall.deque_size=deque_size(d)：d 是已声明的双端队列；把当前元素数量写入 result。
logicsugar.lst.datacall.dpeekb=dpeekb(d)：d 是已声明的双端队列；读取队尾但不移除，并把值写入 result（空时返回 NaN）。
logicsugar.lst.datacall.dpeekf=dpeekf(d)：d 是已声明的双端队列；读取队首但不移除，并把值写入 result（空时返回 NaN）。
logicsugar.lst.datacall.dpopb=dpopb(d)：d 是已声明的双端队列；移除队尾并把值写入 result（空时返回 NaN）。
logicsugar.lst.datacall.dpopf=dpopf(d)：d 是已声明的双端队列；移除队首并把值写入 result（空时返回 NaN）。
logicsugar.lst.datacall.dpushb=dpushb(d, value)：d 是已声明的双端队列，value 插入队尾；成功时把操作后的长度写入 result；已满时不写入，result 为 -1。
logicsugar.lst.datacall.dpushf=dpushf(d, value)：d 是已声明的双端队列，value 插入队首；成功时把操作后的长度写入 result；已满时不写入，result 为 -1。
logicsugar.lst.datacall.dsize=dsize(d)：d 是已声明的双端队列；把当前元素数量写入 result。
logicsugar.lst.datacall.fill=fill(buf, value)：buf 是已声明的数组或矩阵，value 会写入每个元素。此积木没有返回值。
logicsugar.lst.datacall.group.arrayalgo=数组运算：求和、平均值、最小值、最大值等 14 个运算。卡内按钮切换。
logicsugar.lst.datacall.group.bitsetops=位集操作：置位、清位、测试、计数。卡内按钮切换。
logicsugar.lst.datacall.group.chainops=链表操作：初始化、重置、分配节点、释放节点等 11 个运算。卡内按钮切换。
logicsugar.lst.datacall.group.dequeops=双端队列操作：前端入队、后端入队、前端出队、后端出队等 8 个运算。卡内按钮切换。
logicsugar.lst.datacall.group.heapops=堆操作：压入、弹出、大小。卡内按钮切换。
logicsugar.lst.datacall.group.listops=列表操作：追加、读取、写入、插入等 7 个运算。卡内按钮切换。
logicsugar.lst.datacall.group.mapops=哈希表操作：写入、读取、存在性、删除、大小、清空。卡内按钮切换。
logicsugar.lst.datacall.group.queueops=队列操作：入队、出队、查看队首、大小、清空。卡内按钮切换。
logicsugar.lst.datacall.group.setops=集合操作：添加、存在性、删除、大小、清空。卡内按钮切换。
logicsugar.lst.datacall.group.stackops=栈操作：压入、弹出、查看顶部、大小、清空。卡内按钮切换。
logicsugar.lst.datacall.heap_pop=heap_pop(heap)：heap 是已声明的小顶堆；移除最小值并把它写入 result，空堆时为 NaN。
logicsugar.lst.datacall.heap_push=heap_push(heap, value)：heap 是已声明的小顶堆，value 插入堆中；成功向 result 写入 1；已满不写入，result 为 -1。
logicsugar.lst.datacall.heap_size=heap_size(heap)：heap 是已声明的小顶堆；把当前元素数量写入 result。
logicsugar.lst.datacall.hpop=hpop(heap)：heap 是已声明的小顶堆；移除最小值并把它写入 result，空堆时为 NaN。
logicsugar.lst.datacall.hpush=hpush(heap, value)：heap 是已声明的小顶堆，value 插入堆中；成功向 result 写入 1；已满不写入，result 为 -1。
logicsugar.lst.datacall.hsize=hsize(heap)：heap 是已声明的小顶堆；把当前元素数量写入 result。
logicsugar.lst.datacall.indexof=indexof(buf, value)：buf 是已声明的数组或矩阵，value 是目标值；把第一个匹配下标写入 result，找不到时为 -1。
logicsugar.lst.datacall.lappend=lappend(list, value)：list 是已声明的列表，value 追加到末尾；成功时把追加后的列表长度写入 result；列表满时不写入，result 为 -1。
logicsugar.lst.datacall.lfind=lfind(list, value)：list 是已声明的列表，value 是目标值；把第一个匹配下标写入 result，找不到时为 -1。
logicsugar.lst.datacall.lget=lget(list, index)：list 是已声明的列表，index 是元素下标；把该元素写入 result，越界时为 NaN。
logicsugar.lst.datacall.linsert=linsert(list, index, value)：list 是已声明的列表，index 是插入位置，value 插入该位置；成功向 result 写入 1；无效或已满不写入，result 为 -1。
logicsugar.lst.datacall.lremove=lremove(list, index)：list 是已声明的列表，index 是元素下标；删除该元素并把被删值写入 result，无效时为 NaN。
logicsugar.lst.datacall.lset=lset(list, index, value)：list 是已声明的列表，index 是元素下标，value 是要写入的值；成功向 result 写入 1；越界不写入，result 为 -1。
logicsugar.lst.datacall.lsize=lsize(list)：list 是已声明的列表；把当前元素数量写入 result。
logicsugar.lst.datacall.map_clear=map_clear(map)：map 是已声明的哈希表；清空所有键槽，使其可以开始使用。此积木没有返回值。
logicsugar.lst.datacall.map_contains=map_contains(map, key)：map 是已声明的哈希表，key 是数字键；存在时向 result 写入 1，否则写入 0。
logicsugar.lst.datacall.map_erase=map_erase(map, key)：map 是已声明的哈希表，key 是数字键；删除键：成功向 result 写入 1，键不存在写入 -1。
logicsugar.lst.datacall.map_get=map_get(map, key)：map 是已声明的哈希表，key 是数字键；把存储的值写入 result，不存在时为 NaN。
logicsugar.lst.datacall.map_set=map_set(map, key, value)：map 是已声明的哈希表，key 是数字键，value 是要存储的值；成功向 result 写入 1，满表或无效键写入 -1。
logicsugar.lst.datacall.map_size=map_size(map)：map 是已声明的哈希表；把当前存储的键数量写入 result。
logicsugar.lst.datacall.mapclear=mapclear(map)：map 是已声明的哈希表；清空所有键槽，使其可以开始使用。此积木没有返回值。
logicsugar.lst.datacall.mapdel=mapdel(map, key)：map 是已声明的哈希表，key 是数字键；删除键：成功向 result 写入 1，键不存在写入 -1。
logicsugar.lst.datacall.mapget=mapget(map, key)：map 是已声明的哈希表，key 是数字键；把存储的值写入 result，不存在时为 NaN。
logicsugar.lst.datacall.maphas=maphas(map, key)：map 是已声明的哈希表，key 是数字键；存在时向 result 写入 1，否则写入 0。
logicsugar.lst.datacall.mapset=mapset(map, key, value)：map 是已声明的哈希表，key 是数字键，value 是要存储的值；成功向 result 写入 1，满表或无效键写入 -1。
logicsugar.lst.datacall.mapsize=mapsize(map)：map 是已声明的哈希表；把当前存储的键数量写入 result。
logicsugar.lst.datacall.max=max(buf)：buf 是已声明的数组或矩阵；把最大元素写入结果变量（默认为 result）。
logicsugar.lst.datacall.min=min(buf)：buf 是已声明的数组或矩阵；把最小元素写入结果变量（默认为 result）。
logicsugar.lst.datacall.qclear=qclear(q)：q 是已声明的队列；清空内容及 head/tail/count 状态。此积木没有返回值。
logicsugar.lst.datacall.qpeek=qpeek(q)：q 是已声明的队列；读取队首但不移除，并把值写入 result（空队列返回 NaN）。
logicsugar.lst.datacall.qpop=qpop(q)：q 是已声明的队列；移除队首，并把队首值写入 result（空队列返回 NaN）。
logicsugar.lst.datacall.qpush=qpush(q, value)：q 是已声明的队列，value 会追加到队尾；成功时把入队后的长度写入 result；队列满时不写入，result 为 -1。
logicsugar.lst.datacall.qsize=qsize(q)：q 是已声明的队列；把当前元素数量写入 result。
logicsugar.lst.datacall.queue_clear=queue_clear(q)：q 是已声明的队列；清空内容及 head/tail/count 状态。此积木没有返回值。
logicsugar.lst.datacall.queue_front=queue_front(q)：q 是已声明的队列；读取队首但不移除，并把值写入 result（空队列返回 NaN）。
logicsugar.lst.datacall.queue_pop=queue_pop(q)：q 是已声明的队列；移除队首，并把队首值写入 result（空队列返回 NaN）。
logicsugar.lst.datacall.queue_push=queue_push(q, value)：q 是已声明的队列，value 会追加到队尾；成功时把入队后的长度写入 result；队列满时不写入，result 为 -1。
logicsugar.lst.datacall.queue_size=queue_size(q)：q 是已声明的队列；把当前元素数量写入 result。
logicsugar.lst.datacall.replace=replace(buf, oldValue, newValue)：buf 是已声明的数组或矩阵，oldValue 是要查找的值，newValue 是替换值；把替换次数写入 result。
logicsugar.lst.datacall.reverse=reverse(buf)：buf 是已声明的数组或矩阵；原地反转元素。此积木没有返回值。
logicsugar.lst.datacall.sclear=sclear(s)：s 是已声明的栈；清空内容和隐藏栈顶计数。此积木没有返回值。
logicsugar.lst.datacall.set_add=set_add(set, key)：set 是已声明的集合，key 是数字成员；插入成员，并把成功 1 或满表/无效键 -1 写入 result。
logicsugar.lst.datacall.set_clear=set_clear(set)：set 是已声明的集合；清空所有成员槽，使其可以开始使用。此积木没有返回值。
logicsugar.lst.datacall.set_contains=set_contains(set, key)：set 是已声明的集合，key 是数字成员；存在时向 result 写入 1，否则写入 0。
logicsugar.lst.datacall.set_remove=set_remove(set, key)：set 是已声明的集合，key 是数字成员；删除成员：成功向 result 写入 1，成员不存在写入 -1。
logicsugar.lst.datacall.set_size=set_size(set)：set 是已声明的集合；把当前成员数量写入 result。
logicsugar.lst.datacall.sortasc=sortasc(buf)：buf 是已声明的数组或矩阵；原地升序排序。此积木没有返回值。
logicsugar.lst.datacall.sortdesc=sortdesc(buf)：buf 是已声明的数组或矩阵；原地降序排序。此积木没有返回值。
logicsugar.lst.datacall.speek=speek(s)：s 是已声明的栈；读取栈顶但不移除，并把值写入 result（空栈返回 NaN）。
logicsugar.lst.datacall.spop=spop(s)：s 是已声明的栈；移除栈顶，并把栈顶值写入 result（空栈返回 NaN）。
logicsugar.lst.datacall.spush=spush(s, value)：s 是已声明的栈，value 是要压入的值；成功时把压入后的栈长度写入 result；栈满时不写入，result 为 -1。
logicsugar.lst.datacall.ssize=ssize(s)：s 是已声明的栈；把当前元素数量写入 result。
logicsugar.lst.datacall.stack_clear=stack_clear(s)：s 是已声明的栈；清空内容和隐藏栈顶计数。此积木没有返回值。
logicsugar.lst.datacall.stack_pop=stack_pop(s)：s 是已声明的栈；移除栈顶，并把栈顶值写入 result（空栈返回 NaN）。
logicsugar.lst.datacall.stack_push=stack_push(s, value)：s 是已声明的栈，value 是要压入的值；成功时把压入后的栈长度写入 result；栈满时不写入，result 为 -1。
logicsugar.lst.datacall.stack_size=stack_size(s)：s 是已声明的栈；把当前元素数量写入 result。
logicsugar.lst.datacall.stack_top=stack_top(s)：s 是已声明的栈；读取栈顶但不移除，并把值写入 result（空栈返回 NaN）。
logicsugar.lst.datacall.sum=sum(buf)：buf 是已声明的数组或矩阵；把所有元素之和写入积木左侧结果变量（默认为 result）。
logicsugar.lst.datacall.swap=swap(buf, i, j)：buf 是已声明的数组或矩阵，i 和 j 是元素下标；交换两个元素。此积木没有返回值。
logicsugar.lst.datacall.uadd=uadd(set, key)：set 是已声明的集合，key 是数字成员；插入成员，并把成功 1 或满表/无效键 -1 写入 result。
logicsugar.lst.datacall.uclear=uclear(set)：set 是已声明的集合；清空所有成员槽，使其可以开始使用。此积木没有返回值。
logicsugar.lst.datacall.udel=udel(set, key)：set 是已声明的集合，key 是数字成员；删除成员：成功向 result 写入 1，成员不存在写入 -1。
logicsugar.lst.datacall.uhas=uhas(set, key)：set 是已声明的集合，key 是数字成员；存在时向 result 写入 1，否则写入 0。
logicsugar.lst.datacall.usize=usize(set)：set 是已声明的集合；把当前成员数量写入 result。
logicsugar.lst.datacall.vector_at=vector_at(list, index)：list 是已声明的列表，index 是元素下标；把该元素写入 result，越界时为 NaN。
logicsugar.lst.datacall.vector_erase=vector_erase(list, index)：list 是已声明的列表，index 是元素下标；删除该元素并把被删值写入 result，无效时为 NaN。
logicsugar.lst.datacall.vector_find=vector_find(list, value)：list 是已声明的列表，value 是目标值；把第一个匹配下标写入 result，找不到时为 -1。
logicsugar.lst.datacall.vector_insert=vector_insert(list, index, value)：list 是已声明的列表，index 是插入位置，value 插入该位置；成功向 result 写入 1；无效或已满不写入，result 为 -1。
logicsugar.lst.datacall.vector_push_back=vector_push_back(list, value)：list 是已声明的列表，value 追加到末尾；成功时把追加后的列表长度写入 result；列表满时不写入，result 为 -1。
logicsugar.lst.datacall.vector_set=vector_set(list, index, value)：list 是已声明的列表，index 是元素下标，value 是要写入的值；成功向 result 写入 1；越界不写入，result 为 -1。
logicsugar.lst.datacall.vector_size=vector_size(list)：list 是已声明的列表；把当前元素数量写入 result。
logicsugar.lst.default=默认分支标签：没有任何 case 匹配时执行。
logicsugar.lst.deque=双端队列：把一段区间登记为双端环形缓冲区；运算在同栏的「双端队列操作」卡上，提供前端入队、后端入队、前端出队、后端出队、查看前端、查看后端、大小、清空。
logicsugar.lst.else=else 分支：前面所有条件都不成立时执行。
logicsugar.lst.elseif=elif 分支：当前面的 if/elif 不成立时检查的备选条件。
logicsugar.lst.error=显示错误消息并停止该处理器的执行。
logicsugar.lst.expr=表达式：将表达式计算结果存入变量。
logicsugar.lst.forbegin=for 循环：变量从初值按步长递增，满足条件时持续循环。
logicsugar.lst.funccall=函数调用：在当前位置执行函数体，可选择保存返回值。
logicsugar.lst.funcdef=函数定义：声明带参数的可调用函数。
logicsugar.lst.heap=堆：把一段区间登记为带隐藏计数的小顶堆；运算在同栏的「堆操作」卡上，提供压入、弹出、大小。
logicsugar.lst.ifbegin=if 分支：条件为真时执行分支体。
logicsugar.lst.list=列表：把一段区间登记为带隐藏计数的有序列表；运算在同栏的「列表操作」卡上，提供追加、读取、写入、插入、删除、查找、大小。
logicsugar.lst.log=按指定级别把一条消息写入游戏日志文件。
logicsugar.lst.map=哈希表：把一段区间登记为开放寻址哈希表（先键区后值区）；运算在同栏的「哈希表操作」卡上，提供写入、读取、存在性、删除、大小、清空。首次使用前先执行一次「清空」。
logicsugar.lst.matrix=矩阵：把内存块的一段 行数×列数 区间登记为命名矩阵，让表达式能用 m[i][j] 读写；地址 = 基址 + i*列数 + j。
logicsugar.lst.queue=队列：把一段区间登记为环形缓冲区；运算在同栏的「队列操作」卡上，提供入队、出队、查看队首、大小、清空（展开为 read/write 加隐藏的 head/tail/count 变量）。
logicsugar.lst.record=记录：声明一组固定字段；p.字段 读取、p.字段 = 值 写入，每个字段降级为一个普通变量。
logicsugar.lst.return=返回：结束当前函数调用，可携带返回值。
logicsugar.lst.stack=栈：把一段区间登记为后进先出栈；运算在同栏的「栈操作」卡上，提供压入、弹出、查看顶部、大小、清空（展开为 read/write 加隐藏的栈顶变量）。
logicsugar.lst.switchbegin=switch 分支：将表达式与下方各 case 比较，执行首个匹配项。
logicsugar.lst.uset=集合：把一段区间登记为开放寻址键集合；运算在同栏的「集合操作」卡上，提供添加、存在性、删除、大小、清空。首次使用前先执行一次「清空」。
logicsugar.lst.whilebegin=while 循环：条件为真时重复执行循环体。
